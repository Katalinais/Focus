<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1A1A1A">
<title>Task Manager</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="app">
    <h1>Task Manager</h1>
    <p class="subtitle">Base project — PWA elective, wrap-up of Blocks 1 and 2.</p>

    <form id="task-form" class="task-form">
      <input type="text" id="input-title" placeholder="New task..." required>
      <select id="input-priority">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>
      <button type="submit">Add</button>
    </form>

    <div class="crypto-row">
      <input type="password" id="input-passphrase" placeholder="Encryption passphrase">
      <input type="text" id="input-note" placeholder="Private note (optional, encrypted)">
    </div>
    <p class="crypto-hint">The passphrase is never saved — only used, in memory, to derive the encryption key (Session 22). Use the same one to add and to reveal notes.</p>
    <p id="note-error" class="crypto-error"></p>

    <ul id="task-list" class="task-list"></ul>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
